name: Build Windows x86 EXE

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 5.15.2 (win32_mingw81)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win32_mingw81'
          install-deps: 'true'
          tools: 'tools_mingw,qt.tools.win32_mingw810'

      - name: Build EXE and Copy MinGW Runtime DLLs
        shell: cmd
        run: |
          set PATH=D:\a\mbseedkey64\Qt\5.15.2\mingw81_32\bin;D:\a\mbseedkey64\Qt\Tools\mingw810_32\bin;%PATH%
          qmake mbseedkey.pro CONFIG+=release
          mingw32-make -j4
          copy D:\a\mbseedkey64\Qt\Tools\mingw810_32\bin\libgcc_s_dw2-1.dll build\release\
          copy D:\a\mbseedkey64\Qt\Tools\mingw810_32\bin\libstdc++-6.dll build\release\
          copy D:\a\mbseedkey64\Qt\Tools\mingw810_32\bin\libwinpthread-1.dll build\release\

      - name: Upload Compiled Package
        uses: actions/upload-artifact@v4
        with:
          name: mbseedkey-64byte-win32
          path: build/release/
