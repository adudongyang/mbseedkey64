name: Build Windows x86 MSVC EXE

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC x86 Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Install Qt 5.15.2 (win32_msvc2019)
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win32_msvc2019'

      - name: Build EXE with MSVC
        shell: cmd
        run: |
          qmake mbseedkey.pro CONFIG+=release
          nmake

      - name: Upload Compiled EXE
        uses: actions/upload-artifact@v4
        with:
          name: mbseedkey-64byte-msvc-win32
          path: build/release/MBSeedKey.exe
